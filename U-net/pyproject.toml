[project]
name = "unet-segmentation"
version = "0.1.0"
description = "Reproduction of U-Net segmentation with elastic deformation augmentation (Ronneberger et al., MICCAI 2015)"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "Pillow>=9.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "ruff>=0.0.270",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unet_segmentation"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311"]
