[project]
name = "rl-razor-paritymnist"
version = "0.1.0"
description = "Reproduction of 'RL's Razor: Why Online RL Forgets Less' paper experiments"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "ruff>=0.0.270",
]
viz = [
    "seaborn>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rl_razor_paritymnist"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311"]
