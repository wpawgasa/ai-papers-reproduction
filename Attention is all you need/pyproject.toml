[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-mt"
version = "0.1.0"
description = "Reproduction of 'Attention Is All You Need' (Vaswani et al., NeurIPS 2017)"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0,<2.7",
    "torchvision>=0.15.0,<0.22",
    "torchtext>=0.15.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "datasets>=2.14.0",
    "sacrebleu>=2.3.0",
    "tokenizers>=0.13.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
index-url = "https://download.pytorch.org/whl/cu121"
extra-index-url = ["https://pypi.org/simple"]

[tool.setuptools.packages.find]
where = ["src"]
