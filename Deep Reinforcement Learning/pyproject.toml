[project]
name = "dqn-atari"
version = "0.1.0"
description = "Reproduction of Playing Atari with Deep Reinforcement Learning (Mnih et al., 2013) on Pong"
requires-python = ">=3.9"
dependencies = [
    "torch==2.5.1+cu121",  # cu121 build for CUDA 12.2 driver compatibility (see [tool.uv])
    "numpy>=1.24.0",
    "gymnasium[atari]>=0.29.0",
    "ale-py>=0.8.0",
    "opencv-python-headless>=4.7.0",
    "matplotlib>=3.7.0",
    "imageio>=2.31.0",
    "imageio-ffmpeg>=0.4.9",
    "tqdm>=4.65.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "ruff>=0.0.270",
]

# Pin torch to the cu121 wheel: the CUDA 12.2 driver is too old for the cu124+
# builds PyPI ships by default. unsafe-best-match lets uv pick the +cu121 wheel
# from the pytorch index instead of the higher-versioned cu124 wheel on PyPI.
[tool.uv]
index-url = "https://download.pytorch.org/whl/cu121"
extra-index-url = ["https://pypi.org/simple"]
index-strategy = "unsafe-best-match"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dqn_atari"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 120
