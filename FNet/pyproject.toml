[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fnet-reproduction"
version = "0.1.0"
description = "PyTorch reproduction of FNet: Mixing Tokens with Fourier Transforms (NAACL 2022)"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Papers Reproduction Project"}
]
keywords = ["deep-learning", "transformers", "nlp", "fourier-transform", "efficient-models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "datasets>=2.12.0",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "sentencepiece>=0.1.99",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.22.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.0.0",
    "black>=23.3.0",
    "flake8>=6.0.0",
    "mypy>=1.2.0",
]

[project.urls]
"Homepage" = "https://github.com/papers-reproduction/fnet"
"Paper" = "https://arxiv.org/abs/2105.03824"
"Original Code" = "https://github.com/google-research/google-research/tree/master/f_net"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
